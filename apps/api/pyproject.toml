[project]
name = "tarhino-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.40",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "pydantic-settings>=2.13",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "httpx>=0.29",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"